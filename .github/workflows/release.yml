name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Проверка версии
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$appProject = Get-Content src/Boolka.App/Boolka.App.csproj
          [xml]$coreProject = Get-Content src/Boolka.Core/Boolka.Core.csproj
          $version = [string]$appProject.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne [string]$coreProject.Project.PropertyGroup.Version) { throw 'Версии проектов не совпадают.' }
          if (!(Test-Path "docs/releases/$version.md")) { throw 'Нет описания выпуска.' }
          "BOOLKA_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Проверки Core
        run: |
          dotnet build tests/PackImport.Manifests/PackImport.Manifests.csproj -m:1 -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/PackImport.Manifests/PackImport.Manifests.csproj --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Removal.Containers/Removal.Containers.csproj -m:1 -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Removal.Containers/Removal.Containers.csproj --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Автономная сборка Windows x64
        run: |
          dotnet publish src/Boolka.App/Boolka.App.csproj -p:PublishProfile=WindowsStandalone -p:RuntimeFrameworkVersion=8.0.29 -p:NuGetAudit=false -o artifacts/boolka -m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверки обновления приложения
        run: |
          dotnet build tests/ApplicationUpdates/ApplicationUpdates.csproj -m:1 -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/ApplicationUpdates/ApplicationUpdates.csproj --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: ZIP и контрольная сумма
        run: |
          ./scripts/Package-Windows.ps1 -SourceDirectory artifacts/boolka -OutputDirectory artifacts/packages
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:BOOLKA_RELEASE_VERSION
          gh release create "v$version" "artifacts/packages/boolka-$version-windows-x64-standalone.zip" "artifacts/packages/boolka-$version-SHA256SUMS.txt" --target $env:GITHUB_SHA --title "boolka $version — Windows x64" --notes-file "docs/releases/$version.md" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view "v$version" --json url,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.isPrerelease -or @($release.assets).Count -ne 2) { throw 'Не подтверждён опубликованный релиз с двумя файлами.' }
          $release | ConvertTo-Json -Depth 10 | Set-Content artifacts/published-release.json -Encoding utf8
      - name: Сохранение результата публикации
        if: always()
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:BOOLKA_RELEASE_VERSION) { exit 0 }
          $version = $env:BOOLKA_RELEASE_VERSION
          $report = [ordered]@{
            version = $version
            status = $env:RELEASE_JOB_STATUS
            sourceCommit = $env:GITHUB_SHA
            run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          if (Test-Path artifacts/published-release.json) { $report.release = Get-Content artifacts/published-release.json -Raw | ConvertFrom-Json }
          $report | ConvertTo-Json -Depth 12 | Set-Content "docs/releases/$version-status.json" -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "docs/releases/$version-status.json"
          git commit -m "Record boolka $version release result"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
